<style>
:root {
  --zb-accent: #2F6B4F;    /* Tannengrün (Farbkonzept W5x) */
  --zb-ok: #2F6B4F;      /* Farbkonzept W5x: Tannengrün */
  --zb-warn: #9A5200;    /* Harz */
  --zb-bad: #C8321F;     /* Signalrot */
  --zb-on: #fff;         /* Schrift auf Akzent-/Alarmfläche */
  --zb-fg: #1E2224;      /* Anthrazit */
  --zb-bg: rgba(0,0,0,.045);
  --zb-bg2: rgba(0,0,0,.075);
  --zb-line: rgba(0,0,0,.12);
  --zb-muted: rgba(0,0,0,.52);
  --zb-top: 58px;          /* Platz für Titel und Vergrößern-Symbol der Symcon-Kachel */
}
/* Dark Mode: Bedienflächen deutlich heller als die Kachel */
body.dark {
  --zb-accent: #74B892;
  --zb-ok: #74B892;
  --zb-warn: #EE9A45;
  --zb-bad: #FF5A47;
  --zb-on: #1E2224;
  --zb-fg: #F1F0EB;
  --zb-bg: rgba(255,255,255,.10);
  --zb-bg2: rgba(255,255,255,.15);
  --zb-line: rgba(255,255,255,.16);
  --zb-muted: rgba(255,255,255,.6);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
body { font-family: 'Poppins', 'Work Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 14px; line-height: 1.35; }
button { font: inherit; color: var(--zb-fg); }
#zb, #zb div, #zb span, #zb b { color: var(--zb-fg); }
#zb .lbl, #zb .sub, #zb .facts, #zb .facts span, #zb .kv span, #zb .hint { color: var(--zb-muted); }
#zb .seg button.on, #zb .btn.solid, #zb .badge { color: var(--zb-on); }
#zb .badge.warn { color: var(--zb-on); }
#zb { position: absolute; inset: 0; padding: var(--zb-top) 16px 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.lbl { font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; }

/* Kopf: Status links, Fakten rechts */
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.st { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.st .v { display: flex; align-items: center; gap: 10px; font-size: 26px; font-weight: 500; line-height: 1.1; }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; background: var(--zb-muted); }
.dot.ok { background: var(--zb-ok); box-shadow: 0 0 0 4px rgba(116,184,146,.25); }
.dot.bad { background: var(--zb-bad); box-shadow: 0 0 0 4px rgba(255,90,71,.25); }
.dot.busy { background: var(--zb-warn); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.sub { font-size: 12px; }
.facts { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 12px; text-align: right; }
.facts b { font-weight: 600; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { font-size: 11px; font-weight: 600; letter-spacing: .03em; padding: 3px 9px; border-radius: 999px; background: var(--zb-bad); }
.badge.warn { background: var(--zb-warn); }

/* Abschnitte */
.card { background: var(--zb-bg); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 32px; }
.row .t { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.row .t b { font-weight: 500; }

/* Schalter */
.tg { position: relative; width: 56px; height: 32px; border-radius: 16px; background: var(--zb-line); border: 0; cursor: pointer; padding: 0; flex: none; touch-action: manipulation; }
.tg::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .15s; }
.tg.on { background: var(--zb-accent); }
.tg.on::after { left: 27px; }
.tg:disabled { opacity: .45; cursor: default; }
.prog { height: 6px; border-radius: 3px; background: var(--zb-line); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--zb-accent); transition: width 1s linear; }

/* Protokollstufe */
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--zb-bg2); border-radius: 12px; padding: 4px; }
.seg button { border: 0; background: none; border-radius: 9px; min-height: 38px; cursor: pointer; font-size: 13px; padding: 4px 2px; touch-action: manipulation; }
.seg button.on { background: var(--zb-accent); font-weight: 600; }
.seg button:disabled { cursor: default; }

/* Neustart */
.btn { min-height: 40px; border: 1px solid var(--zb-bad); background: none; color: var(--zb-bad); border-radius: 999px; padding: 6px 16px; cursor: pointer; font-weight: 600; font-size: 13px; touch-action: manipulation; flex: none; }
#zb .btn { color: var(--zb-bad); }
.btn.solid { background: var(--zb-bad); }
#zb .btn.solid { color: var(--zb-on); }
.btn.plain { border-color: var(--zb-line); }
#zb .btn.plain { color: var(--zb-fg); }
.btn:disabled { opacity: .45; cursor: default; }
.acts { display: flex; gap: 8px; }
/* Neue Geräte */
.nd { display: flex; flex-direction: column; gap: 6px; }
.nd + .nd { border-top: 1px solid var(--zb-line); padding-top: 10px; }
.nd .t b { word-break: break-all; }
.nd .meta { font-size: 11px; }
#zb .nd .meta, #zb .nd .err { color: var(--zb-muted); }
#zb .nd .err { color: var(--zb-bad); font-size: 12px; }
.ren { display: flex; gap: 8px; align-items: center; }
.ren input { flex: 1; min-width: 0; font: inherit; font-size: 16px; min-height: 42px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--zb-line); background: var(--zb-bg2); color: var(--zb-fg); }
.ren input:focus { outline: none; border-color: var(--zb-accent); }
.btn2 { min-height: 36px; border: 1px solid var(--zb-accent); background: none; border-radius: 999px; padding: 4px 14px; cursor: pointer; font-weight: 600; font-size: 13px; touch-action: manipulation; }
#zb .btn2 { color: var(--zb-accent); }
.btn2.solid { background: var(--zb-accent); }
#zb .btn2.solid { color: var(--zb-on); }
.lnk { border: 0; background: none; cursor: pointer; font-size: 12px; padding: 6px 4px; }
#zb .lnk { color: var(--zb-muted); }
.chip { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; padding: 5px 12px; border-radius: 999px; background: var(--zb-bg2); flex: none; white-space: nowrap; }
.chip .dot { width: 9px; height: 9px; }
.card .row + .row { border-top: 1px solid var(--zb-line); padding-top: 10px; }
.card .kv + .row { border-top: 1px solid var(--zb-line); padding-top: 10px; }

/* Details */
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12px; }
.kv b { font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }
.hint { font-size: 12px; }

@media (max-width: 420px) {
  #zb { padding-left: 12px; padding-right: 12px; }
  .st .v { font-size: 22px; }
  .card { padding: 12px; }
}
/* kleine Kachel: Status und Anlernen */
body.compact #zb { gap: 8px; padding-bottom: 8px; }
body.compact .more { display: none; }
body.compact .st .v { font-size: 20px; }
body.compact .card { padding: 8px 12px; gap: 6px; }
</style>
<div id="zb"></div>
<script>
// confirm: '' oder welcher Neustart gerade bestätigt werden soll ('z2m' / 'coord')
// edit: IEEE des Geräts, das gerade umbenannt wird; busy: Eingabe aktiv, nicht neu zeichnen
var ZB = { s: null, confirm: '', confirmT: 0, sentLevel: null, offset: 0, edit: null, editVal: '', busy: false, pending: false };
var LEVELS = [['error', 'Fehler'], ['warning', 'Warnung'], ['info', 'Info'], ['debug', 'Debug']];

function handleMessage(data) {
  try { ZB.s = typeof data === 'string' ? JSON.parse(data) : data; } catch (e) { return; }
  if (ZB.s && ZB.s.now) ZB.offset = ZB.s.now * 1000 - Date.now();   // Uhrzeit des Servers für den Countdown
  if (ZB.s && ZB.sentLevel === ZB.s.logLevel) ZB.sentLevel = null;
  if (ZB.busy) { ZB.pending = true; return; }   // während der Eingabe nicht neu zeichnen
  render();
}
function send(ident, value) { if (typeof requestAction === 'function') requestAction(ident, value); }
function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function now() { return Math.floor((Date.now() + ZB.offset) / 1000); }
function since(ts) {
  if (!ts) return '';
  var d = new Date(ts * 1000), t = new Date(), same = d.toDateString() === t.toDateString();
  return 'seit ' + (same ? '' : pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '. ') + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function mmss(sec) { sec = Math.max(0, sec); return Math.floor(sec / 60) + ':' + pad(sec % 60); }
function dur(sec) {
  if (sec === null || sec === undefined) return '–';
  var d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
  return d > 0 ? d + ' T ' + h + ' h' : h > 0 ? h + ' h ' + m + ' min' : m + ' min';
}
function num(v, d) { return v === null || v === undefined ? '–' : Number(v).toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d }); }

/* Koordinator: Neustart läuft, bis er mit kleiner Laufzeit wieder antwortet (höchstens 3 min) */
function coordRestarting(c) {
  if (!c || !c.restartAt || now() - c.restartAt >= 180) return false;
  return !(c.ok && c.ts > c.restartAt && c.uptime !== null && c.uptime <= c.ts - c.restartAt + 5);
}

/* Zeile „neu starten“ mit Rückfrage; key = 'z2m' oder 'coord' */
function restartRow(key, title, info, warn, busy) {
  var h = '<div class="row"><div class="t"><b>' + title + '</b><span class="sub">' + (ZB.confirm === key ? warn : info) + '</span></div>';
  if (ZB.confirm === key) h += '<div class="acts"><button class="btn plain" data-no="1">Abbrechen</button><button class="btn solid" data-yes="' + key + '">Neu starten</button></div>';
  else h += '<button class="btn" data-rs="' + key + '"' + (busy ? ' disabled' : '') + '>Neustart</button>';
  return h + '</div>';
}

/* Neue Geräte: Status aus den Ereignissen von Zigbee2MQTT */
function ndStatus(d) {
  if (d.renameTo && now() - d.renameAt < 20) return ['busy', 'wird umbenannt …'];
  switch (d.status) {
    case 'joined': return ['busy', 'tritt bei …'];
    case 'interview': return ['busy', 'Interview läuft …'];
    case 'ok': return d.supported === false ? ['bad', 'nicht unterstützt'] : ['ok', 'bereit'];
    case 'failed': return ['bad', 'Interview fehlgeschlagen'];
    case 'left': return ['bad', 'hat das Netz verlassen'];
  }
  return ['', d.status || ''];
}
function isIeee(n) { return /^0x[0-9a-f]{16}$/i.test(n); }
function newCard(s) {
  var h = '<div class="card"><span class="lbl">Neue Geräte</span>';
  s.newDevices.forEach(function (d) {
    var st = ndStatus(d), info = [d.vendor, d.model].filter(Boolean).join(' ') + (d.desc ? ' · ' + d.desc : '');
    h += '<div class="nd"><div class="row"><div class="t"><b>' + esc(d.name) + '</b>' + (info ? '<span class="sub">' + esc(info) + '</span>' : '') + '</div>'
      + '<span class="chip"><span class="dot ' + st[0] + '"></span>' + st[1] + '</span></div>'
      + '<div class="meta">angelernt ' + since(d.joined).replace('seit ', '') + (isIeee(d.name) ? '' : ' · ' + esc(d.ieee))
      + (d.instance ? ' · Symcon-Instanz ' + d.instance : ' · noch keine Symcon-Instanz (Konfigurator)') + '</div>';
    if (d.renameError) h += '<div class="err">' + esc(d.renameError) + '</div>';
    if (ZB.edit === d.ieee) {
      h += '<div class="ren"><input id="rn" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="' + esc(ZB.editVal) + '" placeholder="z. B. W50-BUERO-TF" aria-label="Neuer Name">'
        + '<button class="btn2 solid" data-save="' + esc(d.ieee) + '">Speichern</button></div>'
        + '<div class="row"><span class="meta">Gebäude zuerst, z. B. W50-KUECHE-SD. Die Symcon-Instanz zieht mit.</span><button class="lnk" data-cancel="1">Abbrechen</button></div>';
    } else if (d.status !== 'left') {
      h += '<div class="row"><button class="btn2" data-ren="' + esc(d.ieee) + '">Umbenennen</button><button class="lnk" data-dis="' + esc(d.ieee) + '">Ausblenden</button></div>';
    } else {
      h += '<div class="row"><span></span><button class="lnk" data-dis="' + esc(d.ieee) + '">Ausblenden</button></div>';
    }
    h += '</div>';
  });
  return h + '</div>';
}

function coordCard(c) {
  var busy = coordRestarting(c), cls = busy ? 'busy' : c.ok ? 'ok' : c.ts ? 'bad' : '';
  var st = busy ? 'Neustart …' : c.ok ? 'Online' : c.ts ? 'nicht erreichbar' : 'wird abgefragt';
  var mode = c.mode === 0 ? 'LAN' : c.mode === 1 ? 'WLAN' : c.mode === 2 ? 'USB' : '';
  var title = [c.model || 'Koordinator', c.zbHw, mode].filter(Boolean).join(' · ');
  var h = '<div class="card more"><div class="row"><div class="t"><span class="lbl">Koordinator</span><b>' + esc(title) + '</b></div>'
    + '<span class="chip"><span class="dot ' + cls + '"></span>' + st + '</span></div>';
  if (c.ok) {
    h += '<div class="kv">'
      + '<span>Firmware</span><b>' + esc(c.fw || '–') + '</b>'
      + '<span>Zigbee-Firmware</span><b>' + esc(c.zbFw || '–') + (c.zbType === 1 ? ' · Router!' : '') + '</b>'
      + '<span>Temperatur</span><b>' + num(c.espTemp, 1) + ' °C · Funk ' + num(c.zbTemp, 1) + ' °C</b>'
      + '<span>Laufzeit</span><b>' + dur(c.uptime) + '</b>'
      + '<span>Verbindung Z2M</span><b>' + (c.clients === 0 ? 'keine' : (c.clients > 1 ? c.clients + ' Clients · ' : '') + 'seit ' + dur(c.sockUptime)) + '</b>'
      + '</div>';
  } else if (c.ts) {
    h += '<div class="hint">' + esc(c.host) + ' antwortet nicht' + (c.lastOk ? ', zuletzt erreichbar ' + since(c.lastOk).replace('seit ', 'um ') : '') + '.</div>';
  }
  h += restartRow('coord', 'Koordinator neu starten', 'Startet ' + esc(c.hostname || c.host) + ' neu (ca. 30 s).',
    'Zigbee ist bis zu 1 Minute weg, Z2M verbindet sich danach neu.', busy);
  return h + '</div>';
}

/* Hell/Dunkel aus der Textfarbe der Kachel-Visu (helle Schrift = Dark Mode), sonst Systemeinstellung */
function theme() {
  var b = document.body, m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(getComputedStyle(b).color || ''), dark;
  if (m) dark = (0.2126 * m[1] + 0.7152 * m[2] + 0.0722 * m[3]) / 255 > 0.5;
  else dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  b.classList.toggle('dark', dark);
}

/* Neustart läuft: angefordert vor weniger als 3 min und Bridge seitdem noch nicht wieder online gemeldet */
function restarting(s) {
  return s.restartAt > 0 && now() - s.restartAt < 180 && !(s.online && s.since >= s.restartAt);
}

function render() {
  var s = ZB.s, el = document.getElementById('zb');
  if (!s) return;
  theme();
  document.body.classList.toggle('compact', window.innerHeight < 300);
  if (s.error) { el.innerHTML = '<div class="hint">' + esc(s.error) + '</div>'; return; }

  var busy = restarting(s), h = '';
  var cls = busy ? 'busy' : s.online === true ? 'ok' : s.online === false ? 'bad' : '';
  var txt = busy ? 'Neustart …' : s.online === true ? 'Online' : s.online === false ? 'Offline' : 'Unbekannt';

  h += '<div class="head"><div class="st"><div class="v"><span class="dot ' + cls + '"></span>' + txt + '</div>'
    + '<div class="sub">' + (busy ? 'angefordert ' + since(s.restartAt).replace('seit ', 'um ') : since(s.since)) + '</div></div>'
    + '<div class="facts">' + (s.version ? '<span>Z2M <b>' + esc(s.version) + '</b></span>' : '')
    + (s.channel !== null ? '<span>Kanal <b>' + s.channel + '</b></span>' : '')
    + '<span><b>' + s.devices + '</b> Geräte</span></div></div>';

  var b = '';
  if (!s.instOk) b += '<span class="badge">Bridge-Instanz gestört</span>';
  if (s.restartRequired) b += '<span class="badge warn">Neustart erforderlich</span>';
  if (!s.ext.loaded) b += '<span class="badge">Symcon-Erweiterung fehlt</span>';
  else if (!s.ext.current) b += '<span class="badge warn">Erweiterung veraltet</span>';
  var c = s.coord;
  if (c && c.ts && !coordRestarting(c)) {
    if (!c.ok) b += '<span class="badge">Koordinator nicht erreichbar</span>';
    else if (c.clients === 0) b += '<span class="badge warn">Z2M nicht mit Koordinator verbunden</span>';
  }
  if (b) h += '<div class="badges">' + b + '</div>';

  // Anlernen
  var left = s.join && s.joinEnd ? s.joinEnd - now() : 0;
  h += '<div class="card"><div class="row"><div class="t"><b>Anlernen</b><span class="sub" id="jt">'
    + (s.join ? (left > 0 ? 'Beitritt offen · noch ' + mmss(left) : 'Beitritt offen') : 'Beitritt gesperrt') + '</span></div>'
    + '<button class="tg' + (s.join ? ' on' : '') + '" id="join" aria-label="Beitritt zum Netzwerk zulassen"' + (s.canJoin && s.online !== false ? '' : ' disabled') + '></button></div>';
  if (s.join && s.joinEnd) {
    var total = Math.max(1, s.joinEnd - (s.joinStart || s.joinEnd - 254));
    h += '<div class="prog"><i id="jp" style="width:' + Math.max(0, Math.min(100, left / total * 100)) + '%"></i></div>';
  }
  var nd = s.newDevices || [];
  if (s.join && !nd.length) h += '<div class="hint">' + (s.listening === false ? 'Kachel ist nicht mit dem MQTT-Server verbunden: neue Geräte werden nicht angezeigt.' : 'Neue Geräte erscheinen hier, sobald sie beitreten.') + '</div>';
  h += '</div>';

  // neu angelernte Geräte (immer sichtbar, auch in der kleinen Kachel)
  if (nd.length) h += newCard(s);

  // Protokollstufe
  if (s.canLog) {
    var lv = ZB.sentLevel || s.logLevel;
    h += '<div class="card more"><span class="lbl">Protokollierung</span><div class="seg">';
    LEVELS.forEach(function (l) { h += '<button data-l="' + l[0] + '"' + (l[0] === lv ? ' class="on"' : '') + (s.online === false ? ' disabled' : '') + '>' + l[1] + '</button>'; });
    h += '</div></div>';
  }

  // Neustart
  if (s.canRestart) {
    h += '<div class="card more">' + restartRow('z2m', 'Zigbee2MQTT neu starten', 'Startet den Dienst auf der NAS neu.',
      'Alle Zigbee-Geräte sind ca. 1 Minute nicht erreichbar.', busy) + '</div>';
  }

  // Koordinator
  if (c) h += coordCard(c);

  // Details
  h += '<div class="card more"><span class="lbl">Versionen</span><div class="kv">'
    + '<span>Zigbee2MQTT</span><b>' + esc(s.version || '–') + '</b>'
    + '<span>Zigbee Herdsman</span><b>' + esc(s.zh || '–') + '</b>'
    + '<span>Herdsman Converters</span><b>' + esc(s.zhc || '–') + '</b>'
    + '<span>Symcon-Erweiterung</span><b>' + (s.ext.loaded ? esc(s.ext.version) + (s.ext.current ? ' · aktuell' : ' · veraltet') : 'nicht geladen') + '</b>'
    + '</div></div>';

  el.innerHTML = h;
  bind();
}

function bind() {
  var s = ZB.s;
  var j = document.getElementById('join');
  if (j) j.onclick = function () { if (!j.disabled) { j.classList.toggle('on'); send('PermitJoin', !s.join); } };
  document.querySelectorAll('.seg button[data-l]').forEach(function (b) {
    b.onclick = function () {
      if (b.disabled || b.dataset.l === (ZB.sentLevel || s.logLevel)) return;
      ZB.sentLevel = b.dataset.l; render();
      send('LogLevel', b.dataset.l);
    };
  });
  // Umbenennen
  document.querySelectorAll('[data-ren]').forEach(function (b) {
    b.onclick = function () {
      var d = (s.newDevices || []).filter(function (x) { return x.ieee === b.dataset.ren; })[0];
      ZB.edit = b.dataset.ren; ZB.editVal = d && !isIeee(d.name) ? d.name : 'W50-';
      render();
      var i = document.getElementById('rn');
      if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
    };
  });
  var rn = document.getElementById('rn');
  if (rn) {
    rn.addEventListener('focus', function () { ZB.busy = true; });
    rn.addEventListener('blur', function () { setTimeout(function () { ZB.busy = false; if (ZB.pending) { ZB.pending = false; render(); } }, 200); });
    rn.addEventListener('input', function () { ZB.editVal = rn.value; });
    rn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { var sv = document.querySelector('[data-save]'); if (sv) sv.click(); }
      if (e.key === 'Escape') { ZB.edit = null; ZB.busy = false; render(); }
    });
  }
  document.querySelectorAll('[data-save]').forEach(function (b) {
    b.onclick = function () {
      var to = (document.getElementById('rn') || {}).value || '';
      to = to.trim();
      if (!to) return;
      send('RenameDevice', JSON.stringify({ ieee: b.dataset.save, to: to }));
      ZB.edit = null; ZB.busy = false; ZB.pending = false;
      render();
    };
  });
  document.querySelectorAll('[data-cancel]').forEach(function (b) {
    b.onclick = function () { ZB.edit = null; ZB.busy = false; render(); };
  });
  document.querySelectorAll('[data-dis]').forEach(function (b) {
    b.onclick = function () { send('DismissDevice', b.dataset.dis); };
  });
  document.querySelectorAll('[data-rs]').forEach(function (b) {
    b.onclick = function () {
      if (b.disabled) return;
      ZB.confirm = b.dataset.rs; render();
      clearTimeout(ZB.confirmT);
      ZB.confirmT = setTimeout(function () { ZB.confirm = ''; render(); }, 8000);   // Rückfrage verfällt nach 8 s
    };
  });
  document.querySelectorAll('[data-no]').forEach(function (b) {
    b.onclick = function () { ZB.confirm = ''; clearTimeout(ZB.confirmT); render(); };
  });
  document.querySelectorAll('[data-yes]').forEach(function (b) {
    b.onclick = function () {
      var key = b.dataset.yes;
      ZB.confirm = ''; clearTimeout(ZB.confirmT);
      send(key === 'coord' ? 'RestartCoordinator' : 'Restart', true);
    };
  });
}

/* Countdown und Neustart-Anzeige jede Sekunde nachführen, ohne neu zu zeichnen */
setInterval(function () {
  var s = ZB.s;
  if (!s || s.error) return;
  if (s.join && s.joinEnd) {
    var left = s.joinEnd - now(), jt = document.getElementById('jt'), jp = document.getElementById('jp');
    if (jt) jt.textContent = left > 0 ? 'Beitritt offen · noch ' + mmss(left) : 'Beitritt offen';
    if (jp) jp.style.width = Math.max(0, Math.min(100, left / Math.max(1, s.joinEnd - (s.joinStart || s.joinEnd - 254)) * 100)) + '%';
  }
}, 1000);
// Neustart-Anzeige läuft nach 3 min ohne Rückmeldung von selbst aus
setInterval(function () {
  var s = ZB.s;
  if (!s || s.error || ZB.confirm || ZB.busy || ZB.edit) return;
  if ((s.restartAt && now() - s.restartAt < 200) || (s.coord && s.coord.restartAt && now() - s.coord.restartAt < 200)) render();
}, 5000);
window.addEventListener('resize', function () { if (ZB.s && !ZB.busy) render(); });
</script>
